<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Barajas Femenino F7</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barajas F7">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tema")||"dark";document.documentElement.dataset.size=localStorage.getItem("letra")||"n";document.documentElement.dataset.eq=localStorage.getItem("equipos")||"cam"}catch(e){document.documentElement.dataset.theme="dark";document.documentElement.dataset.size="n";document.documentElement.dataset.eq="cam"}</script>
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon-512.png?v=2">
<style>
/* Estilo app de iPhone: fondo agrupado, tarjetas redondeadas, barra de pestañas inferior translúcida */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --ink2:#3c3c4399; --ink3:#3c3c434d; --sep:#c6c6c8;
  --fill:#7676801f; --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --yellow:#f5c400; --hero:#ffffff; --hero-ink:#000000; --hero-ink2:#3c3c4399;
  --hf:rgba(0,0,0,.045); --hf2:rgba(0,0,0,.07); --hf3:rgba(0,0,0,.18); --acc:#a37f00;
  --us:#f5c40026; --kit:#e5e5ea; --kit-line:#8e8e93;
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf599; --ink3:#ebebf54d; --sep:#38383a;
  --fill:#7676803d; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --hero:#1c1c1e; --hero-ink:#ffffff; --hero-ink2:#ffffffa6; --hf:rgba(255,255,255,.08); --hf2:rgba(255,255,255,.13); --hf3:rgba(255,255,255,.25); --acc:#f5c400; --us:#f5c4002e; --kit:#3a3a3c; --kit-line:#8e8e93; --bar:rgba(22,22,24,.86); color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-theme="auto"]{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf599; --ink3:#ebebf54d; --sep:#38383a;
  --fill:#7676803d; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --hero:#1c1c1e; --hero-ink:#ffffff; --hero-ink2:#ffffffa6; --hf:rgba(255,255,255,.08); --hf2:rgba(255,255,255,.13); --hf3:rgba(255,255,255,.25); --acc:#f5c400; --us:#f5c4002e; --kit:#3a3a3c; --kit-line:#8e8e93; --bar:rgba(22,22,24,.86); color-scheme:dark}}
html[data-size="g"] .wrap{zoom:1.13}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
button,a{-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
a{color:var(--blue);text-decoration:none}

/* Título grande */
header{padding:18px 4px 14px}
header .sub{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}
header h1{margin:2px 0 0;font:700 34px/1.1 var(--font);letter-spacing:-.02em}

/* Tarjeta principal (partido seleccionado) */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px 16px 18px;position:relative;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.12)}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:100%;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 14px,#111 14px 28px)}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--hero-ink2);text-align:center;flex:1}
.hero .lbl b{color:var(--acc);font-weight:700}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hf2);color:var(--hero-ink);flex:none}
.arrow:disabled{opacity:.3}
.arrow svg{width:16px;height:16px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;margin-top:14px}
.match .side{padding-top:4px}
.match .side .shirt{width:54px;height:54px}
.match .mid{align-self:start}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.side .nm{font-weight:600;font-size:15px;line-height:1.2}
.mid{text-align:center;min-width:92px}
.mid .big{font:700 34px/1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mid .small{font-size:13px;color:var(--hero-ink2);margin-top:4px}
.pill{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--hf2);color:var(--hero-ink)}
.pill.W{background:var(--green);color:#fff}.pill.L{background:var(--red);color:#fff}.pill.D{background:var(--orange);color:#fff}
.old{font-size:13px;color:var(--hero-ink2);text-decoration:line-through;margin-bottom:4px}
.pill.prov{background:var(--hf2);color:var(--acc);border:1px dashed var(--acc)}
.pill.chg{background:var(--orange);color:#fff}
.gm .when2{grid-column:1/-1;text-align:center;font-size:12px;color:var(--ink2);margin-top:-2px}
.gm .when2 s{opacity:.7;margin-right:4px}
.gm .when2 b{color:var(--orange);font-weight:600}
.pill.next{background:var(--yellow);color:#111}
.place{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:14px;background:var(--hf);color:var(--hero-ink)}
.place svg{width:18px;height:18px;flex:none;color:var(--acc)}
.place .t{min-width:0;font-size:14px;line-height:1.25}
.place .t span{display:block;font-size:12px;color:var(--hero-ink2)}
.place .go{margin-left:auto;font-size:14px;font-weight:600;color:var(--acc);flex:none}
.extra{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--hf);font-size:14px}
.wx svg{width:26px;height:26px;color:var(--acc);flex:none}
.wx .t span{display:block;font-size:12px;color:var(--hero-ink2)}
.wx .deg{margin-left:auto;font:700 22px var(--round)}
.h2h{padding:10px 12px;border-radius:14px;background:var(--hf);font-size:14px}
.h2h .hd{font-size:12px;font-weight:600;color:var(--hero-ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.h2h .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.h2h .r b{font-family:var(--round)}
.h2h .r .W{color:var(--green)}.h2h .r .L{color:var(--red)}.h2h .r .D{color:var(--orange)}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--hero-ink2);border-bottom:2px solid var(--hero-ink2);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.fold[open]>summary{margin-bottom:6px}
.ant{margin:0 0 6px;font-size:13px;color:var(--hero-ink2)}
.ant summary{cursor:pointer;list-style:none}
.ant summary::-webkit-details-marker{display:none}
.ant summary::after{content:" · ver convocadas";color:var(--acc)}
.ant[open] summary::after{content:" · ocultar"}
.ant .chips{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--hf2)}
.chip .dn{font:700 12px var(--round);margin-right:5px;opacity:.75}
.chip.gol{background:var(--yellow);color:#111;font-weight:600}
.dots{display:flex;justify-content:center;gap:5px;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hf3)}
.dots i.on{background:var(--yellow)}

/* Secciones tipo lista agrupada */
h2{font:700 22px/1.2 var(--font);margin:26px 4px 8px;letter-spacing:-.01em}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.cell.sel{background:var(--us)}
.cell .txt{min-width:0;flex:1}
.cell .ttl{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .meta{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.res{font:600 17px/1 var(--round)}
.tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.W{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.L{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.tag.D{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.cell .when{font-size:13px;color:var(--ink2)}
.cell.rest .ttl{color:var(--ink2)}
.chev{width:8px;height:13px;color:var(--ink3);flex:none}
.note{font-size:13px;color:var(--ink2);margin:8px 16px 0;line-height:1.4}

/* Racha */
.form{display:flex;gap:6px;margin:0 4px}
.form span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--round);color:#fff}
.form .W{background:var(--green)}.form .D{background:var(--orange)}.form .L{background:var(--red)}

/* Tabla */
.tbl{background:var(--card);border-radius:14px;overflow-x:auto}
.tbl tr.tap{cursor:pointer}
.segtop{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:16px 0 4px}
.segtop button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.segtop button[aria-pressed="true"]{background:var(--yellow);color:#111}
.riv .meta .rk{display:inline-flex;margin:0 0 0 6px;vertical-align:middle}
.ficha{padding:2px 14px 14px 54px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.ficha .k2{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.ficha .campo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ficha .campo a{font-weight:600;color:var(--acc);white-space:nowrap}
.ficha .tdet{background:var(--fill)}
.mapa{height:340px;border-radius:14px;overflow:hidden;background:var(--fill);position:relative;z-index:0}
.mapa .leaflet-control-attribution{font-size:9px}
.mapa.leaflet-container{background:var(--card)}
.escp{width:28px;height:28px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px var(--sep)}
.escp>*{grid-area:1/1}
.escp img{width:24px;height:24px;object-fit:contain}
.escp svg{display:none}
.escp.x{background:none;box-shadow:none}.escp.x img{display:none}.escp.x svg{display:block}
.zl{font:600 11px -apple-system,system-ui,sans-serif;color:var(--ink2);text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--card),0 0 3px var(--card)}
.pin{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden;border:2px solid #fff}
.pin img{width:28px!important;height:28px!important;object-fit:contain}
.pin.nx{border-color:#f5c400;box-shadow:0 0 0 4px rgba(245,196,0,.45),0 2px 6px rgba(0,0,0,.35)}
.pin.us{background:#141414;border-color:#f5c400}
.pop b{display:block;font-size:14px}.pop span{display:block;color:#666;font-size:12px;margin:2px 0 6px}.pop a{font-weight:600}
.tbl tr.tap td.t .who::after{content:"›";margin-left:auto;padding-left:6px;color:var(--ink3);font-weight:600;transition:transform .2s}
.tbl tr.tap.open td.t .who::after{transform:rotate(90deg)}
.tbl tr.det td{padding:0 10px 10px;text-align:left;white-space:normal}
.tdet{background:var(--fill);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.tdet .r{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center}
.tdet .r .j{color:var(--ink2);font-variant-numeric:tabular-nums}
.tdet .r .vs{display:flex;align-items:center;gap:6px;min-width:0}
.tdet .r .vs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdet .r .vs small{color:var(--ink2)}
.tdet .r b{font:700 13px var(--round);padding:2px 7px;border-radius:7px;background:var(--card)}
.tdet .r b.W{background:color-mix(in srgb,var(--green) 30%,transparent)}.tdet .r b.D{background:color-mix(in srgb,var(--orange) 30%,transparent)}.tdet .r b.L{background:color-mix(in srgb,var(--red) 28%,transparent)}
.tdet .r.fut{opacity:.6}
.tdet .hd4{font-size:12px;color:var(--ink2);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:center;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--ink2)}
tbody tr{border-top:.5px solid var(--sep)}
td.t,th.t{text-align:left;padding-left:12px}
td.t .who{display:flex;align-items:center;gap:8px;min-width:140px;white-space:normal;line-height:1.2}
td.p{font-weight:700}
tr.us{background:var(--us)} tr.us td.t{font-weight:700}
td.pos{color:var(--ink2);width:28px;padding-left:12px}

/* Selector de jornada */
.seg{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.seg .lbl2{flex:1;text-align:center;font-weight:600}
.seg .lbl2 span{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--blue)}
.round:disabled{color:var(--ink3)}
.round svg{width:15px;height:15px}
.gm{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:6px;padding:12px 14px;position:relative}
.gm + .gm::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.gm .h{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-align:right;min-width:0;font-size:14px}
.gm .a{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.gm .s{text-align:center;font:600 16px var(--round)}
.gm.us{background:var(--us)} .gm b{font-weight:700}
.gm .where{grid-column:1/-1;text-align:center;font-size:12px}
.shirt{flex:none;display:block}
.cr{display:inline-grid;flex:none}
.cr>*{grid-area:1/1;width:100%!important;height:100%!important}
.cr img{object-fit:contain;background:#fff;border-radius:24%;padding:9%;box-sizing:border-box}
.cr svg{visibility:hidden}
.cr.x svg{visibility:visible}
.cr.x img{display:none}

/* Barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:#8e8e93;padding:4px 0}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-selected="true"]{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ---- Inicio: cuenta atrás y widgets ---- */
.count{display:flex;align-items:center;gap:12px;margin-top:12px}
.count .n{font:800 58px/1 var(--round);color:var(--acc);font-variant-numeric:tabular-nums}
.count .cw{font-size:17px;font-weight:600;color:var(--hero-ink2);line-height:1.2}
.btns{display:flex;gap:8px;margin-top:10px}
.rk{display:flex;gap:3px;margin-top:4px}
.rk i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.rk i.W{background:var(--green)}.rk i.D{background:var(--orange)}.rk i.L{background:var(--red)}
.duel .rkr{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.duel .rkr .rk{margin:0}
.shimg{width:100%;border-radius:14px;display:block}
[data-team]{cursor:pointer}
.eqbox{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.eqtop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:-6px 0 6px}
.eqimgs{display:flex;gap:22px;align-items:center;justify-content:center}
.eqesc{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.eqesc img{width:100px;height:100px;object-fit:contain}
.eqn{font:800 24px var(--round);margin-top:6px}
.eqm{color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:6px}
.eqm .rk{margin:0}
.eqbox .ficha{padding:4px 0 0}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:var(--yellow);color:#111;font-weight:600;font-size:15px}
.btn.ghost{background:var(--hf2);color:var(--hero-ink);flex:none;width:46px}
.btn svg{width:18px;height:18px}
.pred{font-size:13px;color:var(--hero-ink2);text-align:center;margin-top:6px;line-height:1.35}
.pred b{color:var(--acc);font-weight:600}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.w.wide{grid-column:1/-1}
.w .k{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.w .v{font:700 40px/1 var(--round)}
.w .s{font-size:13px;color:var(--ink2)}
.w .row{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.w .row.us{font-weight:700}
/* ---- Temporada: línea de tiempo ---- */
.tl{position:relative;padding-left:24px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--sep)}
.tli{position:relative;width:100%;text-align:left}
.tli .dot{position:absolute;left:-23px;top:18px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:var(--ink3)}
.tli .dot.W{background:var(--green)}.tli .dot.L{background:var(--red)}.tli .dot.D{background:var(--orange)}
.tli .dot.next{background:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 35%,transparent)}
.tc{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tc.next{background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 2px var(--yellow)}
.tc.next .m1{color:var(--hero-ink2)}
.tc.future{opacity:.6}
.tc .m1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2)}
.tc .m2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc .m2 .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;min-width:0}
.tc .m2 .sc{font:700 20px var(--round);flex:none}

const ETAPAS=[["pedir","Avisar a GitHub",6],["cola","Esperando turno",8],["prep","Preparando",8],["rffm","Leyendo la web de la RFFM",55],["guardar","Guardando",8],["publicar","Publicando en la app",50]];
let UP=null;
function actualizar(){
  const sh=document.getElementById("up");sh.hidden=false;
  if(UP&&!UP.fin)return;
  let est={};try{est=JSON.parse(localStorage.getItem("upEst")||"{}")}catch(e){}
  let prev=null;try{prev=JSON.parse(localStorage.getItem("upAct")||"null")}catch(e){}
  UP=prev&&Date.now()-prev.t0<15*60e3?{...prev,est}:{id:Math.random().toString(36).slice(2,8),t0:Date.now(),ver:_loadedVer,run:null,est};
  UP.etapa=UP.etapa||0;UP.desde=UP.desde||{};UP.fin=false;
  bucle();
}
document.getElementById("upX").onclick=()=>{document.getElementById("up").hidden=true};
const gh=(ruta,o={})=>fetch(REPO+ruta,{...o,cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+clave(),...(o.body?{"Content-Type":"application/json"}:{})}});
function pintaUp(txt,err){
  const u=UP,now=Date.now();
  document.getElementById("upL").innerHTML=ETAPAS.map(([k,l],i)=>`<li class="${i<u.etapa||u.ok?"ok":i===u.etapa?(err?"ko":u.fin?"":"on"):""}">${l}</li>`).join("");
  /* Progreso: etapas hechas + parte de la actual según lo que suele tardar (aprendido de veces anteriores) */
  const dur=k=>u.est[k]||ETAPAS.find(e=>e[0]===k)[2];
  const total=ETAPAS.reduce((a,[k])=>a+dur(k),0);
  let hecho=ETAPAS.slice(0,u.etapa).reduce((a,[k])=>a+dur(k),0);
  if(u.etapa<ETAPAS.length&&!u.ok){const k=ETAPAS[u.etapa][0];hecho+=dur(k)*Math.min(.92,(now-(u.desde[k]||now))/1000/dur(k))}
  const pc=u.ok?100:Math.min(99,hecho/total*100);
  const bar=document.getElementById("upBar");bar.classList.toggle("err",!!err);bar.firstElementChild.style.width=pc+"%";
  document.getElementById("upTxt").textContent=txt||(u.ok?"¡Listo!":Math.round(pc)+" %");
  const s=Math.round((now-u.t0)/1000);document.getElementById("upT").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function pasa(k){const u=UP,i=ETAPAS.findIndex(e=>e[0]===k);if(i<=u.etapa&&u.desde[k])return;
  for(let j=u.etapa;j<i;j++){const kk=ETAPAS[j][0];if(u.desde[kk]){u.est[kk]=Math.round(((u.est[kk]||ETAPAS[j][2])+(Date.now()-u.desde[kk])/1000)/2)}}
  if(i>u.etapa)u.etapa=i;u.desde[k]=u.desde[k]||Date.now();
  try{localStorage.setItem("upEst",JSON.stringify(u.est))}catch(e){}}
function falla(txt){UP.fin=true;pintaUp(txt,true);try{localStorage.removeItem("upAct")}catch(e){}}
async function bucle(){
  const u=UP;const tic=setInterval(()=>{if(!u.fin)pintaUp()},500);
  try{
    pasa("pedir");pintaUp();
    if(!u.run){
      if(!u.pedido){const r=await gh("/actions/workflows/actualizar.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main",inputs:{modo:"rapida",id:u.id}})});
        if(r.status===401)return falla("La clave no vale o ha caducado. Cámbiala en Ajustes.");
        if(r.status===403||r.status===404)return falla("La clave no tiene permiso para actualizar.");
        if(!r.ok)return falla("GitHub no ha respondido ("+r.status+"). Prueba en un rato.");
        u.pedido=true;try{localStorage.setItem("upAct",JSON.stringify({id:u.id,t0:u.t0,ver:u.ver,run:null,pedido:true}))}catch(e){}}
      for(let n=0;!u.run&&n<40;n++){await new Promise(r=>setTimeout(r,2500));
        const r=await gh("/actions/workflows/actualizar.yml/runs?event=workflow_dispatch&per_page=10");if(!r.ok)continue;
        const x=(await r.json()).workflow_runs.find(w=>w.display_title==="Actualizar "+u.id);if(x)u.run=x.id}
      if(!u.run)return falla("GitHub no ha empezado la actualización. Prueba otra vez.");
      try{localStorage.setItem("upAct",JSON.stringify({id:u.id,t0:u.t0,ver:u.ver,run:u.run}))}catch(e){}
    }
    pasa("cola");
    /* Seguir los pasos de la ejecución en GitHub */
    for(;;){await new Promise(r=>setTimeout(r,3000));
      const r=await gh("/actions/runs/"+u.run);if(!r.ok)continue;const run=await r.json();
      if(run.status==="completed"&&run.conclusion==="cancelled"){
        /* Otra actualización ha ocupado su sitio: seguimos esa */
        const q=await gh("/actions/workflows/actualizar.yml/runs?per_page=5");const o=q.ok?(await q.json()).workflow_runs.find(w=>w.status!=="completed"):null;
        if(o){u.run=o.id;continue}return falla("La actualización se ha cancelado.")}
      const j=await gh("/actions/runs/"+u.run+"/jobs");const steps=j.ok?((await j.json()).jobs[0]||{}).steps||[]:[];
      const st=n=>steps.find(s=>s.name===n)||{};
      if(st("Guardar cambios").status&&st("Guardar cambios").status!=="queued")pasa("guardar");
      else if(st("Leer la web de la RFFM").status==="in_progress"||st("Leer la web de la RFFM").status==="completed")pasa("rffm");
      else if(steps.some(s=>s.status!=="queued"))pasa("prep");
      if(st("Leer la web de la RFFM").conclusion==="failure")return falla("La web de la RFFM no ha respondido bien. Siguen los datos de antes.");
      if(run.status==="completed"){if(run.conclusion!=="success")return falla("No se ha podido terminar. Siguen los datos de antes.");break}
    }
    /* GitHub Pages tarda un poco en publicar el data.json nuevo */
    pasa("publicar");
    for(let n=0;n<100;n++){await new Promise(r=>setTimeout(r,4000));
      const d=await fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).catch(()=>null);
      if(d&&d.actualizado!==u.ver){pasa("fin");u.ok=true;u.fin=true;pintaUp();try{localStorage.removeItem("upAct")}catch(e){}
        setTimeout(()=>location.reload(),1200);return}}
    falla("Se ha leído todo, pero la app tarda en publicarse. Vuelve a abrirla en unos minutos.");
  }catch(e){falla("Sin conexión. Prueba otra vez.")}
  finally{clearInterval(tic)}
}

function start(DATA){
  ESC=DATA.escudos||{};
  _loadedVer=DATA.actualizado;
  try{const a=JSON.parse(localStorage.getItem("upAct")||"null");if(a&&clave()&&Date.now()-a.t0<15*60e3)setTimeout(actualizar,300);else localStorage.removeItem("upAct")}catch(e){}
  const J=DATA.jornadas, DET=DATA.detalles||{};
  /* Nombre y la inicial del primer apellido (la página es pública) */
  const nomC=n=>{const [ap,no]=String(n).split(",").map(x=>x.trim());return capW(no?no.split(" ")[0]:"")+(ap?" "+ap[0].toUpperCase()+".":"")};
  const nomL=nomC;
  const ini=n=>{const [ap,no]=String(n).split(",").map(x=>x.trim());return ((no||"?")[0]+(ap||"?")[0]).toUpperCase()};

  /* Nuestros partidos */
  const ours=J.map(([j,f,ms])=>{
    const m=ms.find(x=>x[0]===US||x[1]===US);
    if(!m) return {j,f,cf:f,rest:true};
    const d=DET[j]||{}, home=m[0]===US;
    return {j,cf:f,f:d.fecha||f,hora:d.hora||null,campo:d.campo||null,goles:d.goles||null,conv:d.convocadas||null,dors:d.dorsales||{},camb:(d.cambios||[]).slice(-1)[0]||null,home,opp:home?m[1]:m[0],
      g:m[2]?(home?m[2]:[m[2][1],m[2][0]]):null, raw:m[2]};
  });
  /* ¿Ya tiene día y hora oficiales? Si no, se habla del fin de semana entero */
  /* La RFFM publica los horarios oficiales el lunes de la semana del partido a las 9:00.
     Antes de eso, la hora del acta es solo una previsión y puede cambiar. */
  const lunes9=o=>{const d=dOf(o.cf);d.setDate(d.getDate()-5);d.setHours(9,0,0,0);return d};
  const oficial=o=>!!(o.raw||(o.hora&&new Date()>=lunes9(o)));
  const provisional=o=>!o.raw&&!!o.hora&&!oficial(o);
  const finde=o=>{const a=dOf(o.cf),b=new Date(a);b.setDate(a.getDate()+1);return [a,b]};
  const rango=(o,largo)=>{const [a,b]=finde(o);const m=d=>d.toLocaleDateString("es-ES",{month:largo?"long":"short"});
    return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${m(b)}`:`${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`};
  const kind=o=>!o.g?null:o.g[0]>o.g[1]?"W":o.g[0]<o.g[1]?"L":"D";
  const kindTxt={W:"Victoria",L:"Derrota",D:"Empate"};
  const nextIdx=Math.max(0,ours.findIndex(o=>!o.rest&&!o.g&&dOf(o.f)>=today));
  let sel=nextIdx;

  /* Clasificación calculada (la usan varias pestañas) */
  const S={};const add=t=>S[t]??={t,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
  J.forEach(([,,ms])=>ms.forEach(([h,a,g])=>{add(h);add(a);if(!g)return;const H=S[h],A=S[a];
    H.pj++;A.pj++;H.gf+=g[0];H.gc+=g[1];A.gf+=g[1];A.gc+=g[0];
    if(g[0]>g[1]){H.g++;A.p++;H.pts+=3}else if(g[0]<g[1]){A.g++;H.p++;A.pts+=3}else{H.e++;A.e++;H.pts++;A.pts++}}));
  let TABLA=Object.values(S).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||sn(x.t).localeCompare(sn(y.t)));
  /* Si la RFFM ha dado su clasificación oficial (con sanciones, etc.), manda esa */
  let OFICIAL=false;
  if(Array.isArray(DATA.clasif)&&DATA.clasif.length===TABLA.length&&DATA.clasif.every(r=>S[r.t])){
    TABLA=DATA.clasif.map(r=>({...r})).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||sn(x.t).localeCompare(sn(y.t)));TABLA.forEach(r=>{S[r.t]=r});OFICIAL=true;
  }
  const posOf=t=>TABLA.findIndex(r=>r.t===t)+1;
  /* Racha: resultados de los últimos 5 partidos jugados (de más antiguo a más reciente) */
  const forma=t=>{const r=[];J.forEach(([,,ms])=>ms.forEach(([h,a,g])=>{if(!g||(h!==t&&a!==t))return;const x=h===t?g[0]-g[1]:g[1]-g[0];r.push(x>0?"W":x<0?"L":"D")}));return r.slice(-5)};
  const rkTxt={W:"ganado",D:"empatado",L:"perdido"};
  const racha=t=>{const f=forma(t);return f.length?`<span class="rk" aria-label="Últimos partidos: ${f.map(k=>rkTxt[k]).join(", ")}">${f.map(k=>`<i class="${k}"></i>`).join("")}</span>`:""};

  /* Horarios: cuándo suele jugar cada equipo en casa */
  const base=t=>t.replace(/\s+'[A-Z]'$/,"");
  /* Mismo equipo entre temporadas: mismo nombre, y si los dos llevan letra ('A', 'B'), la misma letra.
     Si hay más de un candidato posible, solo vale el nombre exacto. */
  const letra=t=>(t.match(/'([A-Z])'$/)||[])[1]||null;
  const mismo=(a,b)=>a===b||(base(a)===base(b)&&(!letra(a)||!letra(b)||letra(a)===letra(b)));
  /* Equipos que jugaron en nuestro grupo la temporada pasada: si un club tenía varios equipos (A, B…) y este año
     no lleva letra, se usa el que estuvo en nuestra liga */
  const NUESTRO=new Set(((DATA.anterior&&DATA.anterior.grupos)||[]).filter(g=>g.jornadas.some(x=>x[2].some(m=>m[0]===US||m[1]===US)))
    .flatMap(g=>g.jornadas.flatMap(x=>x[2].flatMap(m=>[m[0],m[1]]))));
  const resolver=(t,lista)=>{if(lista.includes(t))return t;const c=[...new Set(lista)].filter(x=>mismo(x,t));if(c.length===1)return c[0];
    const n=c.filter(x=>NUESTRO.has(x));return n.length===1?n[0]:null};
  const HOR={};
  Object.entries(DATA.horarios||{}).forEach(([url,[loc,f,h]])=>{if(!f||!h)return;const k=loc;
    (HOR[k]??=[]).push({f,h,temp:/temporada=21/.test(url)?"25-26":"26-27",prev:dOf(f)>=today})});
  const franja=h=>{const x=+h.split(":")[0];return x<14?"por la mañana":x<19?"por la tarde":"por la noche"};
  const diaTxt=d=>d===6?"sábado":d===0?"domingo":"entre semana";
  /* Patrón de cada equipo en casa: día y franja más repetidos, con cuántos partidos se ha calculado */
  function patron(local){
    const keys=Object.keys(HOR);
    const ant=resolver(local,keys.filter(k=>k!==local&&mismo(k,local)));
    const T=[...(HOR[local]||[]),...(ant?HOR[ant]:[])].slice().sort((a,b)=>a.f<b.f?1:-1);
    /* Solo cuentan los partidos ya jugados; los futuros se enseñan aparte como previstos */
    const L=T.filter(x=>!x.prev);if(!L.length)return T.length?{n:0,nl:0,lab:"",hora:"",fiable:false,empate:false,todos:T,resto:[]}:null;
    const cnt={};L.forEach(x=>{const k=diaTxt(dOf(x.f).getDay())+" "+franja(x.h);cnt[k]=(cnt[k]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
    const [lab,n]=top[0];
    const empate=top[1]&&top[1][1]===n;
    const horasTop=L.filter(x=>diaTxt(dOf(x.f).getDay())+" "+franja(x.h)===lab).map(x=>x.h);
    const hc={};horasTop.forEach(h=>hc[h]=(hc[h]||0)+1);
    const hora=Object.entries(hc).sort((a,b)=>b[1]-a[1])[0][0];
    const fiable=L.length>=3&&!empate&&n/L.length>=.5;
    return {n:L.length,lab,nl:n,hora,fiable,empate,todos:T,resto:top.slice(1)};
  }
  /* Búsqueda exacta en Google Maps para campos cuyo nombre del acta lleva a un sitio equivocado
     (según la ubicación que nos ha pasado el equipo) */
  const MAPS_EXACTO={"A.D. VILLAVICIOSA DE ODON 'B'":"Campos Municipales de Villaviciosa de Odón, Calle Alexander Graham Bell 2, 28670 Villaviciosa de Odón"};
  const placeOf=o=>{
    const t=o.home?US:o.opp, c=CAMPOS[t];
    if(MAPS_EXACTO[t]){const name=o.campo?cleanCampo(o.campo):(c?c[0]:"");return {name,sub:"Campos Municipales · C/ Alexander Graham Bell, 2",url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(MAPS_EXACTO[t])}}
    const name=o.campo?cleanCampo(o.campo):(c?c[0]:"Campo por confirmar");
    const sub=o.campo?(c?c[1].split(",").pop().trim():""):(c?c[1]+" · campo habitual del club":"");
    const q=o.campo?"campo de fútbol "+o.campo.replace(/\(.*?\)/g,"").trim()+(c?", "+c[1]:", Madrid"):(c?c[0]+", "+c[1]:"");
    return {name,sub,url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)};
  };

  /* Archivo de calendario (.ics) para el partido */
  function icsUrl(o){
    const L=sn(o.home?US:o.opp),V=sn(o.home?o.opp:US),p=placeOf(o);
    const d=o.f.replace(/-/g,"");let when;

  /* Temporada pasada contra el rival seleccionado */
  const ANT=DATA.anterior&&DATA.anterior.grupos||[];
  function h2h(oppHoy){
    const games=[];let tabla=null;const opp0=base(oppHoy);
    for(const g of ANT){
      const S2={};
      const nm=resolver(oppHoy,g.jornadas.flatMap(x=>x[2].flatMap(m=>[m[0],m[1]])));const opp=nm||"__";
      g.jornadas.forEach(([j,f,ms])=>ms.forEach(([h,a,r,acta])=>{
        if((h===US&&a===opp)||(h===opp&&a===US))games.push({f,h:h===opp?oppHoy:h,a:a===opp?oppHoy:a,r,ac:acta&&DATA.anterior.actas?DATA.anterior.actas[acta]:null});
        [h,a].forEach(t=>S2[t]??={t,pj:0,pts:0,gf:0,gc:0});
        if(!r)return;S2[h].pj++;S2[a].pj++;S2[h].gf+=r[0];S2[h].gc+=r[1];S2[a].gf+=r[1];S2[a].gc+=r[0];
        if(r[0]>r[1])S2[h].pts+=3;else if(r[0]<r[1])S2[a].pts+=3;else{S2[h].pts++;S2[a].pts++}}));
      if(S2[opp]){const rows=Object.values(S2).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf);
        tabla={pos:rows.findIndex(r=>r.t===opp)+1,n:rows.length,pts:S2[opp].pts,gf:S2[opp].gf,gc:S2[opp].gc}}

    return {games,tabla};

  /* ---------- TEMPORADA: línea de tiempo ---------- */

  /* Calendario mensual: fin de semana marcado hasta que hay día y hora oficial */
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  function marcas(){
    const M={};
    ours.forEach((o,i)=>{
      const sat=dOf(o.cf),sun=new Date(sat);sun.setDate(sat.getDate()+1);

  function drawMonth(){

  }

  /* Partidos de un equipo esta temporada (jugados y por jugar) */
  function partidosDe(t){const H=DATA.horarios||{},jug=[],fut=[];
    J.forEach(([j,f,ms])=>ms.forEach(([h,a,g,acta])=>{if(h!==t&&a!==t)return;const casa=h===t,rv=casa?a:h,hr=acta&&H[acta];
      const o={j,f:hr&&hr[1]?hr[1]:f,casa,rv,g:g?(casa?g:[g[1],g[0]]):null};(g?jug:fut).push(o)}));return {jug,fut}}

  /* ---------- CLASIFICACIÓN: nuestro grupo, otros grupos y goleadoras ---------- */

      TABLA.map((r,i)=>`<tr class="tap${r.t===US?" us":""}" data-t="${esc(r.t)}"><td class="pos">${i+1}</td><td class="t"><span class="who">${shirt(r.t,22)}${esc(sn(r.t))}</span><span style="display:block;padding-left:30px">${racha(r.t)}</span></td><td class="p">${r.pts}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td></tr>`).join("")+
      `</tbody></table></div><p class="note">${OFICIAL?"Datos oficiales de la RFFM, ordenados por puntos.":"Calculada con los resultados."}</p>`+mx;

  let mxT=US;

  /* ---------- MAPA DE CAMPOS (OpenStreetMap; cada campo con el escudo de su club) ---------- */
  /* Coordenadas del campo de casa de cada equipo (buscadas en OpenStreetMap; la de Barajas es aproximada) */
  const CAMPO_GEO={"C.D. BARAJAS":[40.4712,-3.5775],"A.D. MADRID SUR":[40.3800,-3.6647],"S.A.D. COLEGIO SAN GABRIEL":[40.5066,-3.3874],"C.D. ALGETE":[40.6001,-3.5127],
    "C.D. NUEVO PUERTA BONITA DE CARABANCHEL":[40.3970,-3.7357],"A.D. EL REAL DE MANZANARES":[40.7284,-3.8594],"C.F. SAN AGUSTIN DE GUADALIX":[40.6799,-3.6190],
    "ESC.FUT. EL OLIVO DE COSLADA":[40.4160,-3.5765],"CDB FUTBOL FEMENINO OLYMPIA LAS ROZAS":[40.5098,-3.8935],"C.D. SANFER19":[40.4300,-3.5211],
    "A.D. VILLAVICIOSA DE ODON 'B'":[40.3531,-3.9062],"C.D. FUTBOL TRES CANTOS":[40.6114,-3.7045],"ESCUELA MUNICIPAL DE COBEÑA":[40.5807,-3.5049]};
  /* Nombre del campo de casa según las actas */
  const campoCasa=t=>{for(const [j,,ms] of J){const m=ms.find(x=>x[0]===t&&(x[0]===US||x[1]===US));const d=m&&DET[j];if(d&&d.campo)return cleanCampo(d.campo)}return CAMPOS[t]?CAMPOS[t][0]:""};
  let mapaPend=false,MAPA=null;
  function cargaLeaflet(){return window.L?Promise.resolve():new Promise((ok,ko)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(c);
    const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
  function pintaMapa(){
    if(!mapaPend)return;mapaPend=false;const el=document.getElementById("mapa");if(!el)return;
    cargaLeaflet().then(()=>{
      if(MAPA){MAPA.remove();MAPA=null}
      const oscuro=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
      MAPA=L.map(el,{scrollWheelZoom:false,attributionControl:true,zoomControl:true});
      /* Fondo propio y muy simple: solo los municipios de la Comunidad y los distritos de Madrid (OpenStreetMap) */
      MAPA.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>');
      const cs=getComputedStyle(document.documentElement),cv=v=>cs.getPropertyValue(v).trim();
      const DIST=new Set(["Centro","Arganzuela","Retiro","Salamanca","Chamartín","Tetuán","Chamberí","Fuencarral-El Pardo","Moncloa-Aravaca","Latina","Carabanchel","Usera","Puente de Vallecas","Moratalaz","Ciudad Lineal","Hortaleza","Villaverde","Villa de Vallecas","Vicálvaro","San Blas - Canillejas","Barajas"]);
      const dentro=(ll,geom)=>{const [y,x]=ll;const polys=geom.type==="Polygon"?[geom.coordinates]:geom.coordinates;
        return polys.some(poly=>{let ins=false;const r=poly[0];for(let i=0,j=r.length-1;i<r.length;j=i++){const [xi,yi]=r[i],[xj,yj]=r[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}return ins})};
      fetch("zonas.json").then(r=>r.json()).then(z=>{
        const feats=z.features.filter(f=>f.properties.l===8||DIST.has(f.properties.n));
        const conCampo=new Set(),etiquetas=[];feats.forEach(f=>Object.entries(CAMPO_GEO).forEach(([t,ll])=>{if(S[t]&&dentro(ll,f.geometry)){conCampo.add(f);etiquetas.push([ll,f.properties.n])}}));
        L.geoJSON({type:"FeatureCollection",features:feats},{interactive:false,style:f=>{const c=conCampo.has(f),d=f.properties.l===9;
          return {color:oscuro?"#4a4a4e":"#c7c7cc",weight:d?.6:.8,fillOpacity:1,
            fillColor:c?(oscuro?"#3a3520":"#fff4c2"):d?(oscuro?"#2c2c2e":"#ececf0"):(oscuro?"#232325":"#f6f6f8")}}}).addTo(MAPA).bringToBack();
        /* Nombre de la zona de cada campo (se ve al acercar) */
        etiquetas.forEach(([ll,n])=>L.marker(ll,{interactive:false,icon:L.divIcon({className:"zl",html:esc(n),iconSize:[140,14],iconAnchor:[70,-21]})}).addTo(zonasTxt));
      }).catch(()=>{});
      const zonasTxt=L.layerGroup();
      const verTxt=()=>{if(MAPA.getZoom()>=11)zonasTxt.addTo(MAPA);else zonasTxt.remove()};MAPA.on("zoomend",verTxt);
      const nx=ours[nextIdx],sitioNx=nx&&!nx.rest?(nx.home?US:nx.opp):null;
      const pts=[];
      Object.entries(CAMPO_GEO).forEach(([t,ll])=>{if(!S[t])return;pts.push(ll);
        const img=t===US?"escudo-barajas.png":ESC[t];
        const html=`<div class="pin${t===US?" us":""}${t===sitioNx?" nx":""}">${img?`<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">${camiseta(t,26)}</span>`:camiseta(t,26)}</div>`;
        const icon=L.divIcon({className:"",html,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16]});
        const campo=campoCasa(t),q=encodeURIComponent(MAPS_EXACTO[t]||("campo de fútbol "+campo+", "+(CAMPOS[t]?CAMPOS[t][1].split(",").pop().trim():"Madrid")));
        const mk=L.marker(ll,{icon,zIndexOffset:t===sitioNx?1000:t===US?500:0}).addTo(MAPA)
          .bindPopup(`<div class="pop"><b>${esc(sn(t))}</b><span>${esc(campo)}${t===sitioNx?" · próximo partido":""}</span><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Abrir en Google Maps</a></div>`);
      });
      MAPA.fitBounds(pts,{padding:[24,24]});MAPA.setMinZoom(8);MAPA.setMaxZoom(14);verTxt();
    }).catch(()=>{el.innerHTML='<p class="note" style="padding:12px">No se ha podido cargar el mapa.</p>'});
  }

  /* ---------- OTRAS CLASIFICACIONES (otro grupo de este año y los dos del año pasado) ---------- */
  const TB=(DATA.tablas||[]).slice().sort((a,b)=>b.temporada.localeCompare(a.temporada)||a.grupo.localeCompare(b.grupo));
  let tbSel=0;
  const nomEq=t=>{if(SHORT[t])return SHORT[t];const l=base(t)!==t?" "+t.match(/'([A-Z])'$/)[1]:"";
    return capW(base(t).replace(/^(C\.?D\.?E?\.?|A\.?D\.?(Y\.?C\.?)?|S\.?A\.?D\.?|C\.?F\.?|CDE|CDB|C\.D\.B\.|E\.?F\.?|ESC\.?\s*(DE\s*)?FUT\.?|ESCUELA (MUNICIPAL )?DE FUTBOL)\s+/i,"")).replace(/^(Futbol Femenino|De Futbol) /i,"")+l};
  /* Qué fila de cada tabla corresponde a un equipo de nuestro grupo de este año (misma regla de letras A/B que en el resto de la app) */
  const enNuestro=x=>{const nombres=(x.temporada==="2025-2026"?TB.filter(y=>y.temporada===x.temporada).flatMap(y=>y.filas.map(f=>f.t)):x.filas.map(f=>f.t));
    const m={};TABLA.forEach(q=>{const r=resolver(q.t,nombres);if(r)m[r]=q.t});return m};
  /* Escudo del club en una plaquita redonda (si no carga, se ve la camiseta) */
  const escudoDe=(t,url)=>{const u=t===US?"escudo-barajas.png":url;if(!u)return shirt(t,22);
    return `<span class="escp" data-team="${esc(t)}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('x')">${camiseta(t,22)}</span>`};
  function otras(){
    if(!TB.length)return "";
    return `<h2>Otras clasificaciones</h2><div class="pick" id="tbpick">${TB.map((x,i)=>`<button class="pk${i===tbSel?" on":""}" data-i="${i}" aria-pressed="${i===tbSel}">${esc(x.grupo)} · ${x.temporada.replace(/^20(\d\d)-20(\d\d)$/,"$1/$2")}</button>`).join("")}</div><div id="tbbox"></div>`}
  function bindOtras(){
    const box=document.getElementById("tbbox");if(!box)return;const x=TB[tbSel];
    box.innerHTML=`<div class="tbl"><table><thead><tr><th class="t" colspan="2">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th></tr></thead><tbody>`+
      (M=>x.filas.map((r,i)=>{const hoy=M[r.t],us=hoy===US,est=!!hoy&&!us,let_=(r.t.match(/'([A-Z])'$/)||[])[1];
        return `<tr${us?' class="us"':""}><td class="pos">${i+1}</td><td class="t"><span class="who">${escudoDe(hoy||r.t,(x.escudos||{})[r.t])}<span>${est?"<b>":""}${esc(hoy?sn(hoy).replace(/ [A-Z]$/,"")+(let_?" "+let_:""):nomEq(r.t))}${est?"</b>":""}${est?`<br><small style="color:var(--ink2)">en nuestro grupo este año</small>`:""}</span></span></td><td class="p">${r.pts}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td></tr>`}).join(""))(enNuestro(x))+
      `</tbody></table></div><p class="note">${x.temporada==="2026-2027"?"Clasificación actual":"Clasificación final"} · ${x.fuente==="oficial"?"datos oficiales de la RFFM":"calculada con los resultados"}.</p>`;
    document.querySelectorAll("#tbpick .pk").forEach(b=>b.onclick=()=>{tbSel=+b.dataset.i;document.querySelectorAll("#tbpick .pk").forEach(c=>{c.classList.toggle("on",c===b);c.setAttribute("aria-pressed",c===b)});bindOtras()});
  }

  /* Goleadoras de la liga (en Clasificación) */
  function goleadorasHTML(){
    const G=(DATA.goleadoras||[]).filter(r=>r&&r.n);
    const norm=t=>t.replace("VILLAVICIOSA DE ODON B","VILLAVICIOSA DE ODON 'B'");
    let pos=0,prev=null;
    return G.length?`<h2>Goleadoras de la liga</h2><div class="tbl"><table><thead><tr><th class="t" colspan="2">Jugadora</th><th>Goles</th></tr></thead><tbody>`+
      G.map((r,i)=>{if(r.g!==prev){pos=i+1;prev=r.g}const eq=norm(r.eq);return `<tr${eq===US?' class="us"':""}><td class="pos">${pos}</td><td class="t"><span class="who">${shirt(eq,22)}<span>${esc(nomL(r.n))}<br><small style="color:var(--ink2)">${esc(sn(eq))}</small></span></span></td><td class="p">${r.g}</td></tr>`}).join("")+
      `</tbody></table></div>`:`<p class="note">Aún no hay goleadoras.</p>`}

  /* ---------- FICHA DE UN EQUIPO (en Rivales y al tocar cualquier camiseta o escudo) ---------- */
  function fichaEquipo(t){
      const p=placeOf({home:false,opp:t}),campo=campoCasa(t)||p.name;
      const pt=patron(t),{jug,fut}=partidosDe(t);
      const nos=ours.filter(o=>!o.rest&&o.opp===t);
      const {games}=DATA.anterior?h2h(t):{games:[]};
      const casa=pt?(pt.fiable?`Suele jugar en casa el <b>${pt.lab}</b>, sobre las ${pt.hora}`:pt.n?`Sin patrón claro (${pt.n} partido${pt.n>1?"s":""} en casa)`:"Aún sin partidos en casa"):"Sin datos de horarios";
      const nosTxt=nos.map(o=>{const k=kind(o);return `<div class="r${o.g?"":" fut"}"><span class="j">J${o.j}</span><span class="vs"><span>${o.home?"En casa":"Fuera"} <small>· ${oficial(o)&&o.hora?fmt(o.f,{day:"numeric",month:"short"})+" "+o.hora:"finde "+rango(o)}</small></span></span>${o.g?`<b class="${k}">${o.g[0]}-${o.g[1]}</b>`:"<small>—</small>"}</div>`}).join("");
      const ant=games.filter(g=>g.r).map(g=>{const ourG=g.h===US?g.r[0]:g.r[1],thG=g.h===US?g.r[1]:g.r[0],k=ourG>thG?"W":ourG<thG?"L":"D";
        return `<div class="r"><span class="j"></span><span class="vs"><span>${g.h===US?"En casa":"Fuera"} <small>· ${fmt(g.f,{day:"numeric",month:"short",year:"2-digit"})}</small></span></span><b class="${k}">${ourG}-${thG}</b></div>`}).join("");
      return `<div class="ficha">
        <div><div class="k2">${t===US?"Nuestro campo":"Su campo"}</div><div class="campo"><span>${esc(campo)}</span><a href="${p.url}" target="_blank" rel="noopener">Cómo llegar</a></div><div class="s" style="color:var(--ink2);margin-top:2px">${casa}</div></div>
        ${t===US?"":`<div><div class="k2">Contra nosotros</div><div class="tdet">${nosTxt}${ant?`<div class="hd4">Temporada pasada</div>${ant}`:""}</div></div>`}
        <div><div class="k2">${t===US?"Nuestros partidos":"Sus partidos"}</div><div class="tdet">${jug.length?jug.map(filaP).join(""):`<div class="hd4">Aún no ha jugado</div>`}${fut.length?`<div class="hd4">Próximo</div>${filaP(fut[0])}`:""}</div></div></div>`}

  function abrirEquipo(t){
    if(!S[t])return;
    const r=S[t],big=t===US?"escudo-barajas.png":ESC[t];
    document.getElementById("eqC").innerHTML=`<div class="eqtop"><div class="eqimgs">${big?`<span class="eqesc"><img src="${esc(big)}" alt="Escudo de ${esc(sn(t))}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></span>`:""}${camiseta(t,110)}</div>
      <div class="eqn">${esc(sn(t))}</div><div class="eqm">${posOf(t)}ª · ${r.pts} pts · ${r.pj} jugados ${racha(t)}</div></div>`+fichaEquipo(t);
    const sh=document.getElementById("eq");sh.hidden=false;sh.querySelector(".sbox").scrollTop=0;
  }
  document.addEventListener("click",e=>{
    const el=e.target.closest&&e.target.closest("[data-team]");
    if(!el||el.closest("#eq,.pk,summary,.cal,.leaflet-container,.sheet"))return;
    e.stopPropagation();e.preventDefault();abrirEquipo(el.dataset.team);
  },true);

  /* ---------- RIVALES: mapa de campos y ficha de cada equipo ---------- */
  function drawRiv(){
    const teams=TABLA.map(r=>r.t).filter(t=>t!==US);
    const ficha=fichaEquipo;
    const nx=ours[nextIdx];
    document.getElementById("p-riv").innerHTML=`<h2>Campos</h2><div class="mapa" id="mapa"></div>
      <h2>Equipos</h2><div class="hr">`+teams.map(t=>{const r=S[t],o=ours.find(x=>!x.rest&&x.opp===t&&!x.g);
        return `<details class="hd3 riv"${nx&&nx.opp===t?" open":""}><summary class="cell">${escudoDe(t,ESC[t])}<div class="txt"><div class="ttl">${esc(sn(t))}</div><div class="meta">${posOf(t)}ª · ${r.pts} pts${racha(t)}</div></div><div class="end when">${o?`J${o.j}<br><small>${o.home?"en casa":"fuera"}</small>`:"<small>jugado</small>"}</div></summary>${ficha(t)}</details>`}).join("")+`</div>`;
    mapaPend=true;if(!document.getElementById("p-riv").hidden)pintaMapa();
  }

  /* ---------- PLANTILLA ---------- */
  let orden="goles";
  function drawPla(){
    const P=[...players].sort(orden==="goles"?(a,b)=>b.g-a.g||b.pj-a.pj||a.n.localeCompare(b.n):orden==="pj"?(a,b)=>b.pj-a.pj||b.g-a.g||a.n.localeCompare(b.n):(a,b)=>nomL(a.n).localeCompare(nomL(b.n)));
    document.getElementById("p-pla").innerHTML=`<h2>La plantilla</h2><div class="squad">
      <div class="seg2" role="group" aria-label="Ordenar">${[["goles","Goles"],["pj","Partidos"],["az","A–Z"]].map(([k,t])=>`<button data-o="${k}" aria-pressed="${orden===k}">${t}</button>`).join("")}</div>
      <div class="sq h"><span></span><span>Jugadora</span><span style="text-align:center">PJ</span><span style="text-align:center">Goles</span></div>`+
      (P.length?P.map(p=>`<div class="sq">${p.dorsal!=null?`<span class="dsh">${espaldaBarajas(42,p.dorsal)}</span>`:`<span class="av">${esc(ini(p.n))}</span>`}<span class="nm">${esc(nomL(p.n))}</span><span class="pj">${p.pj}</span><span class="n${p.g?"":" z"}">${p.g}</span></div>`).join(""):`<div class="sq"><span></span><span class="nm">Aún no hay actas con convocatoria</span></div>`)+
      `</div><p class="note">PJ = partidos convocada.</p>`;
    document.querySelectorAll("#p-pla .seg2 button").forEach(b=>b.onclick=()=>{orden=b.dataset.o;drawPla()});
  }

  /* ---------- JORNADAS ---------- */
  let cur=Math.max(0,J.findIndex(([,f])=>dOf(f)>=today));
  function drawJor(){
    const [j,f,ms,rest]=J[cur];
    const n=t=>t===US?`<b>${esc(sn(t))}</b>`:esc(sn(t));
    marcoCal();document.getElementById("calL").innerHTML=`<h2>Jornadas</h2><div class="seg"><button class="round" id="jp" aria-label="Jornada anterior" ${cur===0?"disabled":""}>${ico.left}</button><div class="lbl2">Jornada ${j}<span>${fmt(f,{weekday:"long",day:"numeric",month:"long"})}</span></div><button class="round" id="jn" aria-label="Jornada siguiente" ${cur===J.length-1?"disabled":""}>${ico.right}</button></div>
      <div class="group">`+ms.map(([h,a,g,acta])=>{const us=h===US||a===US;const c=CAMPOS[h];
        const hr=acta&&DATA.horarios?DATA.horarios[acta]:null;
        const dj=us?DET[j]:null;
        const fh=dj&&dj.hora?{f:dj.fecha,h:dj.hora,c:dj.cambios&&dj.cambios.slice(-1)[0]&&dj.cambios.slice(-1)[0].antes.hora?{fecha:dj.cambios.slice(-1)[0].antes.fecha,hora:dj.cambios.slice(-1)[0].antes.hora}:null}:hr&&hr[2]?{f:hr[1],h:hr[2],c:hr[3]||null}:null;
        const prov=!g&&new Date()<lunes9({cf:f});
        const when2=fh?`<div class="when2">${fh.c?`<s>${fmt(fh.c.fecha)} ${fh.c.hora}</s>`:""}${prov?"Previsto ":""}${fmt(fh.f)} · ${fh.h}${fh.c?" <b>cambio</b>":""}${prov?" <i>(sin confirmar)</i>":""}</div>`:"";
        const where=us&&DET[j]&&DET[j].campo?cleanCampo(DET[j].campo):campoCasa(h)||(c?c[0]:"");
        return `<div class="gm${us?" us":""}"><div class="h">${n(h)}${shirt(h,24)}</div><div class="s">${g?g[0]+" - "+g[1]:"–"}</div><div class="a">${shirt(a,24)}${n(a)}</div>${when2}${where?`<div class="where"><a href="${placeOf(us?ours.find(o=>o.j===j):{home:false,opp:h}).url}" target="_blank" rel="noopener">${esc(where)}</a></div>`:""}</div>`}).join("")+
      `</div>`+rest.map(t=>`<p class="note">Descansa: ${esc(sn(t))}</p>`).join("")+(new Date()<lunes9({cf:f})&&!ms.some(m=>m[2])?`<p class="note">Horarios oficiales: lunes ${lunes9({cf:f}).getDate()} a las 9:00.</p>`:"");
    document.getElementById("jp").onclick=()=>{if(cur>0){cur--;drawJor();syncHero(J[cur][0])}};
    document.getElementById("jn").onclick=()=>{if(cur<J.length-1){cur++;drawJor();syncHero(J[cur][0])}};
  }
  function syncHero(j){const i=ours.findIndex(o=>o.j===j);if(i>=0){sel=i;drawHero();drawCal()}}

  drawHero();drawWidgets();drawCal();drawTab();drawRiv();drawPla();drawJor();
  if(DATA.actualizado){const horas=(Date.now()-new Date(DATA.actualizado))/36e5;const st=document.getElementById("stale");
    if(horas>5){st.hidden=false;st.textContent=`Los datos no se actualizan desde hace ${Math.round(horas)} horas. Prueba a darle a actualizar; si sigue así, puede que la web de la RFFM haya cambiado.`}}
  if(DATA.actualizado){const d=new Date(DATA.actualizado);document.getElementById("upd").textContent="Datos de la RFFM · actualizado el "+d.toLocaleString("es-ES",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}

  const TABS=["home","cal","tab","riv","pla"];
  function go(p){
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.p===p));
    TABS.forEach(t=>document.getElementById("p-"+t).hidden=t!==p);
    if(p==="riv")setTimeout(()=>{pintaMapa();if(MAPA)MAPA.invalidateSize()},50);
    try{localStorage.setItem("tab2",p)}catch(e){}
  }
  document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{go(btn.dataset.p);window.scrollTo({top:0})});
  try{let t=localStorage.getItem("tab2");if(t==="jor"){t="cal";calSel="liga";marcoCal()}if(t&&TABS.includes(t))go(t)}catch(e){}
}
</script>
</body>
</html>
