name: Actualizar datos RFFM

on:
  schedule:
    # GitHub se salta muchas ejecuciones programadas cuando va cargado (sobre todo en horas "redondas"),
    # así que se pide a menudo y en minutos raros: aunque se pierda alguna, la siguiente llega pronto.
    - cron: "7,37 * * * *"            # cada media hora
    - cron: "4,14,24,44,54 7,8 * * 1" # lunes entre las 9 y las 11 (hora de Madrid), cada 10 minutos
  workflow_dispatch:          # botón para lanzarlo a mano
    inputs:
      minutos:
        description: "Minutos máximos leyendo horarios (13 normal; 40 para rellenar de golpe)"
        default: "13"

concurrency:
  group: actualizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Leer la web de la RFFM
        run: node scrape.mjs
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '13' }}
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json debug
          git diff --cached --quiet || git commit -m "Actualizar datos RFFM"
          # Por si mientras tanto se subieron otros cambios a la página
          git pull --rebase -X theirs origin main || true
          git push
