name: Actualizar datos RFFM

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas
    - cron: "3 7 * * 1"      # lunes 9:03 en invierno (la RFFM publica los horarios a las 9:00)
    - cron: "3 8 * * 1"      # lunes 9:03 en verano / 10:03 en invierno, por si acaso
  workflow_dispatch:          # botón para lanzarlo a mano
    inputs:
      minutos:
        description: "Minutos máximos leyendo horarios (13 normal; 40 para rellenar de golpe)"
        default: "13"

concurrency:
  group: actualizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Leer la web de la RFFM
        run: node scrape.mjs
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '13' }}
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json debug
          git diff --cached --quiet || git commit -m "Actualizar datos RFFM"
          # Por si mientras tanto se subieron otros cambios a la página
          git pull --rebase -X theirs origin main || true
          git push
