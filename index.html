<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barajas Femenino F7</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barajas F7">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* Estilo app de iPhone: fondo agrupado, tarjetas redondeadas, barra de pestañas inferior translúcida */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --ink2:#3c3c4399; --ink3:#3c3c434d; --sep:#c6c6c8;
  --fill:#7676801f; --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --yellow:#f5c400; --hero:#121212; --hero-ink:#ffffff; --hero-ink2:#ffffffa6;
  --us:#f5c40026; --kit:#e5e5ea; --kit-line:#8e8e93;
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf599; --ink3:#ebebf54d; --sep:#38383a;
  --fill:#7676803d; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --hero:#1c1c1e; --us:#f5c4002e; --kit:#3a3a3c; --kit-line:#8e8e93; --bar:rgba(22,22,24,.86); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
a{color:var(--blue);text-decoration:none}

/* Título grande */
header{padding:18px 4px 14px}
header .sub{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}
header h1{margin:2px 0 0;font:700 34px/1.1 var(--font);letter-spacing:-.02em}

/* Tarjeta principal (partido seleccionado) */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px 16px 18px;position:relative;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.12)}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:100%;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 14px,#111 14px 28px)}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--hero-ink2);text-align:center;flex:1}
.hero .lbl b{color:var(--yellow);font-weight:700}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.arrow:disabled{opacity:.3}
.arrow svg{width:16px;height:16px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.side .nm{font-weight:600;font-size:15px;line-height:1.2}
.mid{text-align:center;min-width:92px}
.mid .big{font:700 34px/1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mid .small{font-size:13px;color:var(--hero-ink2);margin-top:4px}
.pill{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.pill.W{background:var(--green);color:#fff}.pill.L{background:var(--red);color:#fff}.pill.D{background:var(--orange);color:#fff}
.pill.next{background:var(--yellow);color:#111}
.place{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff}
.place svg{width:18px;height:18px;flex:none;color:var(--yellow)}
.place .t{min-width:0;font-size:14px;line-height:1.25}
.place .t span{display:block;font-size:12px;color:var(--hero-ink2)}
.place .go{margin-left:auto;font-size:14px;font-weight:600;color:var(--yellow);flex:none}
.extra{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px}
.wx svg{width:26px;height:26px;color:var(--yellow);flex:none}
.wx .t span{display:block;font-size:12px;color:var(--hero-ink2)}
.wx .deg{margin-left:auto;font:700 22px var(--round)}
.h2h{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px}
.h2h .hd{font-size:12px;font-weight:600;color:var(--hero-ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.h2h .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.h2h .r b{font-family:var(--round)}
.h2h .r .W{color:var(--green)}.h2h .r .L{color:var(--red)}.h2h .r .D{color:var(--orange)}
.ant{margin:0 0 6px;font-size:13px;color:var(--hero-ink2)}
.ant summary{cursor:pointer;list-style:none}
.ant summary::-webkit-details-marker{display:none}
.ant summary::after{content:" · ver convocadas";color:var(--yellow)}
.ant[open] summary::after{content:" · ocultar"}
.ant .chips{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip.gol{background:var(--yellow);color:#111;font-weight:600}
.dots{display:flex;justify-content:center;gap:5px;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--yellow)}

/* Secciones tipo lista agrupada */
h2{font:700 22px/1.2 var(--font);margin:26px 4px 8px;letter-spacing:-.01em}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.cell.sel{background:var(--us)}
.cell .txt{min-width:0;flex:1}
.cell .ttl{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .meta{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.res{font:600 17px/1 var(--round)}
.tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.W{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.L{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.tag.D{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.cell .when{font-size:13px;color:var(--ink2)}
.cell.rest .ttl{color:var(--ink2)}
.chev{width:8px;height:13px;color:var(--ink3);flex:none}
.note{font-size:13px;color:var(--ink2);margin:8px 16px 0;line-height:1.4}

/* Racha */
.form{display:flex;gap:6px;margin:0 4px}
.form span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--round);color:#fff}
.form .W{background:var(--green)}.form .D{background:var(--orange)}.form .L{background:var(--red)}

/* Tabla */
.tbl{background:var(--card);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:center;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--ink2)}
tbody tr{border-top:.5px solid var(--sep)}
td.t,th.t{text-align:left;padding-left:12px}
td.t .who{display:flex;align-items:center;gap:8px;min-width:140px;white-space:normal;line-height:1.2}
td.p{font-weight:700}
tr.us{background:var(--us)} tr.us td.t{font-weight:700}
td.pos{color:var(--ink2);width:28px;padding-left:12px}

/* Selector de jornada */
.seg{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.seg .lbl2{flex:1;text-align:center;font-weight:600}
.seg .lbl2 span{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--blue)}
.round:disabled{color:var(--ink3)}
.round svg{width:15px;height:15px}
.gm{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:6px;padding:12px 14px;position:relative}
.gm + .gm::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.gm .h{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-align:right;min-width:0;font-size:14px}
.gm .a{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.gm .s{text-align:center;font:600 16px var(--round)}
.gm.us{background:var(--us)} .gm b{font-weight:700}
.gm .where{grid-column:1/-1;text-align:center;font-size:12px}
.shirt{flex:none;display:block}

/* Barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:#8e8e93;padding:4px 0}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-selected="true"]{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ---- Inicio: cuenta atrás y widgets ---- */
.count{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.count .n{font:800 64px/0.9 var(--round);color:var(--yellow);font-variant-numeric:tabular-nums}
.count .w{font-size:15px;font-weight:600;color:var(--hero-ink2);line-height:1.2}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:var(--yellow);color:#111;font-weight:600;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;flex:none;width:46px}
.btn svg{width:18px;height:18px}
.pred{font-size:13px;color:var(--hero-ink2);text-align:center;margin-top:6px;line-height:1.35}
.pred b{color:var(--yellow);font-weight:600}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.w.wide{grid-column:1/-1}
.w .k{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.w .v{font:700 40px/1 var(--round)}
.w .s{font-size:13px;color:var(--ink2)}
.w .row{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.w .row.us{font-weight:700}
/* ---- Temporada: línea de tiempo ---- */
.tl{position:relative;padding-left:24px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--sep)}
.tli{position:relative;width:100%;text-align:left}
.tli .dot{position:absolute;left:-23px;top:18px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:var(--ink3)}
.tli .dot.W{background:var(--green)}.tli .dot.L{background:var(--red)}.tli .dot.D{background:var(--orange)}
.tli .dot.next{background:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 35%,transparent)}
.tc{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tc.next{background:#121212;color:#fff}
.tc.next .m1{color:#ffffffa6}
.tc.future{opacity:.6}
.tc .m1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2)}
.tc .m2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc .m2 .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;min-width:0}
.tc .m2 .sc{font:700 20px var(--round);flex:none}
.tc .chips .chip{background:color-mix(in srgb,var(--yellow) 25%,transparent);color:var(--ink)}
.tc.sel{outline:2px solid var(--blue);outline-offset:2px}
.seg2{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 0 10px}
.seg2 button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500}
.seg2 button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
/* ---- Tabla: barras, duelo y cuadro ---- */
.bars{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,42%);align-items:center;gap:8px;font-size:14px}
.bar .p{color:var(--ink2);font-variant-numeric:tabular-nums}
.bar .nm{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:20px;border-radius:6px;background:var(--fill);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--ink3);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;box-sizing:border-box;font-size:12px;font-weight:700;color:var(--ink);min-width:22px}
.bar.us .fill{background:var(--yellow);color:#111}
.bar.us .nm{font-weight:700}
.duel{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.duel .hd2{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;gap:6px}
.dl .t{height:9px;border-radius:5px;background:var(--fill);overflow:hidden;display:flex}
.dl .t.l{justify-content:flex-end}
.dl .t i{display:block;height:100%;border-radius:5px;background:var(--yellow)}
.dl .t.r i{background:var(--ink3)}
.dl .c{text-align:center;font-size:13px}
.dl .c b{font-family:var(--round)}
.mx{overflow-x:auto;background:var(--card);border-radius:14px;padding:8px}
.mx table{border-collapse:separate;border-spacing:3px;font-size:11px;width:auto}
.mx th{font-size:10px;font-weight:700;color:var(--ink2);padding:2px;text-align:center}
.mx th.rh{text-align:right;padding-right:4px;white-space:nowrap}
.mx td{width:30px;height:28px;padding:0;text-align:center;border-radius:6px;background:var(--fill);font:600 11px var(--round);white-space:nowrap}
.mx td.diag{background:repeating-linear-gradient(45deg,var(--sep) 0 3px,transparent 3px 6px)}
.mx td.W{background:color-mix(in srgb,var(--green) 30%,transparent)}
.mx td.L{background:color-mix(in srgb,var(--red) 28%,transparent)}
.mx td.D{background:color-mix(in srgb,var(--orange) 30%,transparent)}
.mx td.us{box-shadow:inset 0 0 0 2px var(--yellow)}
.mx th.us{color:var(--ink);background:color-mix(in srgb,var(--yellow) 40%,transparent);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin:8px 4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.hr{background:var(--card);border-radius:14px;overflow:hidden}
.hr .cell .meta{white-space:normal}
/* ---- Plantilla ---- */
.squad{background:#121212;color:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px}
.sq{display:grid;grid-template-columns:34px minmax(0,1fr) 44px 44px;align-items:center;gap:8px;padding:9px 2px;border-top:.5px solid #2c2c2e}
.sq.h{border-top:0;font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.sq .av{width:30px;height:30px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center;font:700 12px var(--round)}
.sq .av.g{background:var(--yellow);color:#111}
.sq .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq .n{text-align:center;font:700 18px var(--round);font-variant-numeric:tabular-nums}
.sq .n.z{color:#555}
.sq .pj{text-align:center;color:#a0a0a0;font-variant-numeric:tabular-nums}
.squad .seg2{background:#1f1f1f}
.squad .seg2 button{color:#a0a0a0}
.squad .seg2 button[aria-pressed="true"]{background:var(--yellow);color:#111}
</style>

<body>
<div class="wrap">
  <header>
    <div class="sub">Primera Femenino Senior F-7 · Grupo 1</div>
    <h1 id="title">C.D. Barajas</h1>
  </header>
  <main>
    <section id="p-home">
      <section class="hero" id="hero" aria-live="polite"></section>
      <div id="widgets"></div>
    </section>
    <section id="p-cal" hidden></section>
    <section id="p-tab" hidden></section>
    <section id="p-pla" hidden></section>
    <section id="p-jor" hidden></section>
  </main>
  <p class="note" id="upd"></p>
</div>

<nav class="tabs" role="tablist"><div class="in">
  <button role="tab" aria-selected="true" data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19.5z"/></svg>Inicio</button>
  <button role="tab" aria-selected="false" data-p="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Temporada</button>
  <button role="tab" aria-selected="false" data-p="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 21h8M12 17v4M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H3.5v1.5A3.5 3.5 0 0 0 7 11M18 6h2.5v1.5A3.5 3.5 0 0 1 17 11"/></svg>Tabla</button>
  <button role="tab" aria-selected="false" data-p="pla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.6M18 19a5 5 0 0 0-2.6-4.4"/></svg>Plantilla</button>
  <button role="tab" aria-selected="false" data-p="jor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Jornadas</button>
</div></nav>

<script>

const US="C.D. BARAJAS";
const SHORT={"C.D. BARAJAS":"Barajas","A.D. MADRID SUR":"Madrid Sur","S.A.D. COLEGIO SAN GABRIEL":"Colegio San Gabriel","C.D. ALGETE":"Algete","C.D. NUEVO PUERTA BONITA DE CARABANCHEL":"Nuevo Puerta Bonita","A.D. EL REAL DE MANZANARES":"El Real de Manzanares","C.F. SAN AGUSTIN DE GUADALIX":"San Agustín de Guadalix","ESC.FUT. EL OLIVO DE COSLADA":"El Olivo de Coslada","CDB FUTBOL FEMENINO OLYMPIA LAS ROZAS":"Olympia Las Rozas","C.D. SANFER19":"Sanfer19","A.D. VILLAVICIOSA DE ODON 'B'":"Villaviciosa de Odón B","C.D. FUTBOL TRES CANTOS":"Tres Cantos","ESCUELA MUNICIPAL DE COBEÑA":"E.M. Cobeña"};
const sn=t=>SHORT[t]||t;
/* Campo habitual de cada club (se usa si el acta aún no dice el campo) */

const WICO=c=>c===0?'<circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  :c<=3||c<=48?'<path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z" fill="currentColor"/>'
  :'<path d="M7 15h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 15z" fill="currentColor"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';

const dOf=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();

const capW=s=>s.toLowerCase().replace(/(^|[\s\-.(/])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/ (De|Del|La|Las|El|Los|Y)(?= )/g,m=>m.toLowerCase());
const cleanCampo=c=>capW(c.replace(/\((h\.?a\.?|hn|t)\)/i,"").trim()).replace(/\bF7\b/i,"F7").replace(/\bNtra\. Sra\./,"Ntra. Sra.");
let _sid=0;
function shirt(t,size){

  if(k.st){defs=`<pattern id="${id}" width="6" height="32" patternUnits="userSpaceOnUse"><rect width="6" height="32" fill="${k.b}"/><rect x="3.5" width="2.5" height="32" fill="${k.st}"/></pattern>`;body=`url(#${id})`}
  if(k.v==="half"){defs=`<linearGradient id="${id}"><stop offset=".5" stop-color="${k.h}"/><stop offset=".5" stop-color="${k.b}"/></linearGradient>`;body=`url(#${id})`}
  if(k.v==="chev")extra=`<path d="M8.6 11.5 L16 17 L23.4 11.5 L23.4 14.6 L16 20.1 L8.6 14.6 Z" fill="${k.tr}"/>`;
  const leftSl=k.v==="half"?k.h:k.s;
  return `<svg class="shirt" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><defs>${defs}</defs>
<path d="M11 4 L4 8 L2 15 L7 16 L8 13 L8 29 L24 29 L24 13 L25 16 L30 15 L28 8 L21 4 Q16 8 11 4 Z" fill="${body}" stroke="var(--kit-line)" stroke-width=".9" stroke-linejoin="round"/>
<path d="M4 8 L2 15 L7 16 L8 13 Z" fill="${leftSl}" stroke="var(--kit-line)" stroke-width=".9" stroke-linejoin="round"/><path d="M28 8 L30 15 L25 16 L24 13 Z" fill="${k.s}" stroke="var(--kit-line)" stroke-width=".9" stroke-linejoin="round"/>
${extra}<path d="M11.2 4.3 Q16 8.6 20.8 4.3" fill="none" stroke="${k.tr}" stroke-width="1.8" stroke-linecap="round"/>
<path d="M2.4 13.8 L7.3 14.9 M29.6 13.8 L24.7 14.9" stroke="${k.tr}" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const ABR={"C.D. BARAJAS":"BAR","A.D. MADRID SUR":"MSU","S.A.D. COLEGIO SAN GABRIEL":"SGA","C.D. ALGETE":"ALG","C.D. NUEVO PUERTA BONITA DE CARABANCHEL":"NPB","A.D. EL REAL DE MANZANARES":"ERM","C.F. SAN AGUSTIN DE GUADALIX":"SAG","ESC.FUT. EL OLIVO DE COSLADA":"OLI","CDB FUTBOL FEMENINO OLYMPIA LAS ROZAS":"OLY","C.D. SANFER19":"S19","A.D. VILLAVICIOSA DE ODON 'B'":"VIL","C.D. FUTBOL TRES CANTOS":"TCA","ESCUELA MUNICIPAL DE COBEÑA":"COB"};

function start(DATA){
  const J=DATA.jornadas, DET=DATA.detalles||{};
  const nomC=n=>{const [ap,no]=String(n).split(",").map(x=>x.trim());return capW((no?no.split(" ")[0]+" ":"")+ap.split(" ")[0])};
  const nomL=n=>{const [ap,no]=String(n).split(",").map(x=>x.trim());return capW((no?no.split(" ")[0]+" ":"")+ap.split(" ")[0])};
  const ini=n=>{const [ap,no]=String(n).split(",").map(x=>x.trim());return ((no||"?")[0]+(ap||"?")[0]).toUpperCase()};

  /* Nuestros partidos */
  const ours=J.map(([j,f,ms])=>{
    const m=ms.find(x=>x[0]===US||x[1]===US);
    if(!m) return {j,f,rest:true};
    const d=DET[j]||{}, home=m[0]===US;
    return {j,f:d.fecha||f,hora:d.hora||null,campo:d.campo||null,goles:d.goles||null,conv:d.convocadas||null,home,opp:home?m[1]:m[0],
      g:m[2]?(home?m[2]:[m[2][1],m[2][0]]):null, raw:m[2]};
  });
  const kind=o=>!o.g?null:o.g[0]>o.g[1]?"W":o.g[0]<o.g[1]?"L":"D";
  const kindTxt={W:"Victoria",L:"Derrota",D:"Empate"};
  const nextIdx=Math.max(0,ours.findIndex(o=>!o.rest&&!o.g&&dOf(o.f)>=today));
  let sel=nextIdx;

  /* Clasificación calculada (la usan varias pestañas) */
  const S={};const add=t=>S[t]??={t,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
  J.forEach(([,,ms])=>ms.forEach(([h,a,g])=>{add(h);add(a);if(!g)return;const H=S[h],A=S[a];
    H.pj++;A.pj++;H.gf+=g[0];H.gc+=g[1];A.gf+=g[1];A.gc+=g[0];
    if(g[0]>g[1]){H.g++;A.p++;H.pts+=3}else if(g[0]<g[1]){A.g++;H.p++;A.pts+=3}else{H.e++;A.e++;H.pts++;A.pts++}}));
  const TABLA=Object.values(S).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||sn(x.t).localeCompare(sn(y.t)));
  const posOf=t=>TABLA.findIndex(r=>r.t===t)+1;

  /* Horarios: cuándo suele jugar cada equipo en casa */
  const base=t=>t.replace(/\s+'[A-Z]'$/,"");
  const HOR={};
  Object.values(DATA.horarios||{}).forEach(([loc,f,h])=>{if(!f)return;const k=base(loc);(HOR[k]??=[]).push({f,h})});
  function patron(local){
    const L=HOR[base(local)]||[];if(!L.length)return null;
    const dc={},hc={};
    L.forEach(x=>{const d=dOf(x.f).getDay();dc[d]=(dc[d]||0)+1;if(x.h)hc[x.h]=(hc[x.h]||0)+1});
    const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
    const td=top(dc),th=top(hc);
    return {n:L.length,dia:DIAS[+td[0]],nd:td[1],hora:th?th[0]:null,nh:th?th[1]:0,horas:Object.entries(hc).sort((a,b)=>b[1]-a[1]).slice(0,3)};
  }

  const placeOf=o=>{
    const t=o.home?US:o.opp, c=CAMPOS[t];
    const name=o.campo?cleanCampo(o.campo):(c?c[0]:"Campo por confirmar");
    const sub=o.campo?(c?c[1].split(",").pop().trim():""):(c?c[1]+" · campo habitual del club":"");
    const q=o.campo?"campo de fútbol "+o.campo.replace(/\(.*?\)/g,"").trim()+(c?", "+c[1]:", Madrid"):(c?c[0]+", "+c[1]:"");
    return {name,sub,url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)};
  };

  /* Archivo de calendario (.ics) para el partido */
  function icsUrl(o){
    const L=sn(o.home?US:o.opp),V=sn(o.home?o.opp:US),p=placeOf(o);
    const d=o.f.replace(/-/g,"");let when;
    if(o.hora){const [hh,mm]=o.hora.split(":");const st=`${d}T${hh.padStart(2,"0")}${mm}00`;const e=new Date(dOf(o.f));e.setHours(+hh+1,+mm);
      const en=`${e.getFullYear()}${String(e.getMonth()+1).padStart(2,"0")}${String(e.getDate()).padStart(2,"0")}T${String(e.getHours()).padStart(2,"0")}${String(e.getMinutes()).padStart(2,"0")}00`;
      when=`DTSTART;TZID=Europe/Madrid:${st}\r\nDTEND;TZID=Europe/Madrid:${en}`}
    else{const e=new Date(dOf(o.f));e.setDate(e.getDate()+1);when=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${e.getFullYear()}${String(e.getMonth()+1).padStart(2,"0")}${String(e.getDate()).padStart(2,"0")}`}
    const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Barajas F7//ES\r\nBEGIN:VEVENT\r\nUID:barajas-j${o.j}-${d}@barajas-f7\r\nSUMMARY:${L} - ${V} (J${o.j})\r\n${when}\r\nLOCATION:${p.name}${p.sub?", "+p.sub:""}\r\nURL:${p.url}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
    return URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  }

  /* Temporada pasada contra el rival seleccionado */
  const ANT=DATA.anterior&&DATA.anterior.grupos||[];
  function h2h(oppHoy){
    const games=[];let tabla=null;const opp0=base(oppHoy);
    for(const g of ANT){
      const S2={};
      const nm=g.jornadas.flatMap(x=>x[2].flatMap(m=>[m[0],m[1]])).find(t=>base(t)===opp0);const opp=nm||"__";
      g.jornadas.forEach(([j,f,ms])=>ms.forEach(([h,a,r,acta])=>{
        if((h===US&&a===opp)||(h===opp&&a===US))games.push({f,h:h===opp?oppHoy:h,a:a===opp?oppHoy:a,r,ac:acta&&DATA.anterior.actas?DATA.anterior.actas[acta]:null});
        [h,a].forEach(t=>S2[t]??={t,pj:0,pts:0,gf:0,gc:0});
        if(!r)return;S2[h].pj++;S2[a].pj++;S2[h].gf+=r[0];S2[h].gc+=r[1];S2[a].gf+=r[1];S2[a].gc+=r[0];
        if(r[0]>r[1])S2[h].pts+=3;else if(r[0]<r[1])S2[a].pts+=3;else{S2[h].pts++;S2[a].pts++}}));
      if(S2[opp]){const rows=Object.values(S2).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf);
        tabla={pos:rows.findIndex(r=>r.t===opp)+1,n:rows.length,pts:S2[opp].pts,gf:S2[opp].gf,gc:S2[opp].gc}}
    }
    return {games,tabla};
  }

  function fillExtra(o){
    const box=document.getElementById("extra");if(!box)return;
    let html="";
    if(o.raw&&o.goles){
      html+=`<div class="h2h"><div class="hd">Goles</div>`+(o.goles.length?o.goles.map(g=>`<div class="r"><span>${g.propia?esc(nomC(g.nombre))+' <small style="color:var(--hero-ink2)">en propia puerta</small>':g.nuestro?"<b>"+esc(nomC(g.nombre))+"</b>":esc(nomC(g.nombre))+` <small style="color:var(--hero-ink2)">(${esc(sn(o.opp))})</small>`}</span><b class="${g.nuestro?"W":"L"}">${g.min!=null?g.min+"'":""}</b></div>`).join(""):`<div class="r"><span>Sin goles</span></div>`)+`</div>`;
    }
    if(o.raw&&o.conv&&o.conv.length){
      const scorers=new Set((o.goles||[]).filter(g=>g.nuestro&&!g.propia).map(g=>g.nombre));
      html+=`<div class="h2h"><div class="hd">Convocadas (${o.conv.length})</div><div class="chips">`+o.conv.map(n=>`<span class="chip${scorers.has(n)?" gol":""}">${esc(nomC(n))}</span>`).join("")+`</div></div>`;
    }
    if(DATA.anterior){
      const {games,tabla}=h2h(o.opp);
      if(games.length||tabla){
        html+=`<div class="h2h"><div class="hd">Temporada ${esc(DATA.anterior.temporada)}</div>`+
          games.map(g=>{if(!g.r)return `<div class="r"><span>${esc(sn(g.h))} - ${esc(sn(g.a))}</span><b>–</b></div>`;
            const ourG=g.h===US?g.r[0]:g.r[1],theirG=g.h===US?g.r[1]:g.r[0],k=ourG>theirG?"W":ourG<theirG?"L":"D";
            let det="";
            if(g.ac){
              const cnt={};(g.ac.goles||[]).filter(x=>x.nuestro&&!x.propia).forEach(x=>cnt[x.nombre]=(cnt[x.nombre]||0)+1);
              const gl=Object.entries(cnt).map(([n,c])=>esc(nomC(n))+(c>1?` (${c})`:"")).join(", ");
              det=`<details class="ant"><summary>${gl?"Goles: "+gl:"Sin goles nuestros"}</summary>${g.ac.convocadas&&g.ac.convocadas.length?`<div class="chips">${g.ac.convocadas.map(n=>`<span class="chip${cnt[n]?" gol":""}">${esc(nomC(n))}</span>`).join("")}</div>`:""}</details>`;
            }
            return `<div class="r"><span>${esc(sn(g.h))} - ${esc(sn(g.a))}</span><b class="${k}">${g.r[0]} - ${g.r[1]}</b></div>${det}`}).join("")+
          (tabla?`<div class="r"><span>${esc(sn(o.opp))} acabó ${tabla.pos}ª de ${tabla.n}</span><b>${tabla.pts} pts</b></div><div class="r"><span>Goles a favor / en contra</span><b>${tabla.gf} / ${tabla.gc}</b></div>`:"")+
          `</div>`;
      } else html+=`<div class="h2h"><div class="hd">Temporada ${esc(DATA.anterior.temporada)}</div><div class="r"><span>No jugó en esta liga la temporada pasada</span></div></div>`;
    }
    box.innerHTML=html;
    /* Tiempo: solo si faltan 3 días o menos */
    const days=Math.round((dOf(o.f)-today)/864e5);
    const t=o.home?US:o.opp, geo=GEO[t];
    if(o.raw||days<0||days>3||!geo)return;
    const key=t+o.f;
    const show=w=>{if(!w||sel!==ours.indexOf(o))return;const d=document.createElement("div");d.className="wx";
      d.innerHTML=`<svg viewBox="0 0 24 24">${WICO(w.code)}</svg><div class="t">${WMO(w.code)}<span>${w.at} · ${w.rain}% prob. de lluvia · viento ${w.wind} km/h</span></div><div class="deg">${w.temp}°</div>`;
      box.prepend(d)};
    if(wCache[key])return show(wCache[key]);
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo[0]}&longitude=${geo[1]}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=Europe%2FMadrid&start_date=${o.f}&end_date=${o.f}`)
      .then(r=>r.json()).then(d=>{const H=d.hourly;if(!H)return;
        let i=o.hora?H.time.findIndex(x=>x.endsWith(o.hora.padStart(5,"0").slice(0,2)+":00")):H.time.findIndex(x=>x.endsWith("12:00"));if(i<0)i=12;
        wCache[key]={code:H.weather_code[i],temp:Math.round(H.temperature_2m[i]),rain:H.precipitation_probability[i]??0,wind:Math.round(H.wind_speed_10m[i]),at:o.hora?"Previsión a las "+o.hora:"Previsión a mediodía"};
        show(wCache[key])}).catch(()=>{});
  }

  /* ---------- INICIO: tarjeta del partido (navegable) ---------- */
  function drawHero(){
    const o=ours[sel], h=document.getElementById("hero");
    const isNext=sel===nextIdx&&!o.g&&!o.rest;
    const head=`<div class="top"><button class="arrow" id="hp" aria-label="Partido anterior" ${sel===0?"disabled":""}>${ico.left}</button>
      <div class="lbl">Jornada ${o.j}${isNext?" · <b>Próximo partido</b>":""}</div>
      <button class="arrow" id="hn" aria-label="Partido siguiente" ${sel===ours.length-1?"disabled":""}>${ico.right}</button></div>`;
    const dots=`<div class="dots">${ours.map((_,i)=>`<i class="${i===sel?"on":""}"></i>`).slice(Math.max(0,sel-6),sel+7).join("")}</div>`;
    if(o.rest){h.innerHTML=head+`<div class="match"><div></div><div class="mid"><div class="big">Descanso</div><div class="small">${fmt(o.f,{weekday:"long",day:"numeric",month:"long"})}</div></div><div></div></div>`+dots;bindHero();return}
    const L=o.home?US:o.opp, V=o.home?o.opp:US;
    const days=Math.round((dOf(o.f)-today)/864e5);
    let mid,count="",pred="",btns="";
    if(o.raw){const k=kind(o);mid=`<div class="big">${o.raw[0]} - ${o.raw[1]}</div><div class="small">${fmt(o.f)}</div><span class="pill ${k}">${kindTxt[k]}</span>`}
    else{
      const when=days<0?"Sin resultado":days===0?"Hoy":days===1?"Mañana":`En ${days} días`;
      mid=`<div class="big">${o.hora||fmt(o.f,{day:"numeric",month:"short"})}</div><div class="small">${o.hora?fmt(o.f):"Hora por confirmar"}</div><span class="pill ${isNext?"next":""}">${when}</span>`;
      if(isNext&&days>=0) count=`<div class="count"><div class="n">${days===0?"HOY":days}</div><div class="w">${days===0?"¡día de partido!":days===1?"día para<br>el partido":"días para<br>el partido"}</div></div>`;
      if(!o.hora){const pt=patron(L);if(pt){
        pred=`<div class="pred">${esc(sn(L))} suele jugar en casa el <b>${pt.dia}</b>${pt.hora?` a las <b>${pt.hora}</b>`:""} <span>(${pt.hora?pt.nh:pt.nd} de ${pt.n} partidos)</span></div>`}}
      if(days>=0) btns=`<div class="btns"><a class="btn" id="ics" href="#" download="partido-j${o.j}.ics">${ico.cal}Añadir al calendario</a><button class="btn ghost" id="shr" aria-label="Compartir">${ico.share}</button></div>`;
    }
    const p=placeOf(o);
    h.innerHTML=head+count+`<div class="match fade">
      <div class="side">${shirt(L,54)}<div class="nm">${esc(sn(L))}</div></div>
      <div class="mid">${mid}</div>
      <div class="side">${shirt(V,54)}<div class="nm">${esc(sn(V))}</div></div></div>${pred}
      <a class="place" href="${p.url}" target="_blank" rel="noopener">${ico.pin}<div class="t">${esc(p.name)}<span>${esc(p.sub)}</span></div><span class="go">Cómo llegar</span></a>${btns}<div class="extra" id="extra"></div>`+dots;
    bindHero();fillExtra(o);
    const ic=document.getElementById("ics");if(ic)ic.href=icsUrl(o);
    const sh=document.getElementById("shr");if(sh)sh.onclick=()=>{
      const txt=`${sn(L)} - ${sn(V)} · J${o.j} · ${fmt(o.f,{weekday:"long",day:"numeric",month:"long"})}${o.hora?" a las "+o.hora:""} · ${p.name}`;
      if(navigator.share)navigator.share({title:"Partido del Barajas",text:txt,url:location.href}).catch(()=>{});
      else navigator.clipboard?.writeText(txt+" "+location.href).then(()=>{sh.style.background="var(--green)"}).catch(()=>{});
    };
  }
  function bindHero(){
    document.getElementById("hp").onclick=()=>{if(sel>0){sel--;drawHero();drawCal()}};
    document.getElementById("hn").onclick=()=>{if(sel<ours.length-1){sel++;drawHero();drawCal()}};
  }
  (function swipe(){let x0=null;const h=document.getElementById("hero");
    h.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
    h.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
      if(Math.abs(dx)>50){if(dx<0&&sel<ours.length-1)sel++;else if(dx>0&&sel>0)sel--;else return;drawHero();drawCal()}},{passive:true});
  })();

  /* Goles y partidos de cada jugadora (de las actas de esta temporada) */
  const PL={};
  ours.forEach(o=>{if(!o.conv)return;o.conv.forEach(n=>{(PL[n]??={n,pj:0,g:0}).pj++});(o.goles||[]).forEach(g=>{if(g.nuestro&&!g.propia)(PL[g.nombre]??={n:g.nombre,pj:0,g:0}).g++})});
  const players=Object.values(PL);

  /* ---------- INICIO: widgets ---------- */
  function drawWidgets(){
    const me=S[US]||{pts:0,gf:0,gc:0,pj:0};
    const played=ours.filter(o=>o.g);
    const form=played.slice(-5).map(o=>`<span class="${kind(o)}">${kind(o)==="W"?"V":kind(o)==="L"?"D":"E"}</span>`).join("");
    const won=played.filter(o=>kind(o)==="W").length;
    const tops=[...players].sort((a,b)=>b.g-a.g||a.n.localeCompare(b.n)).filter(p=>p.g).slice(0,3);
    const p=posOf(US);
    document.getElementById("widgets").innerHTML=`<h2>El equipo</h2><div class="wg">
      <div class="w"><div class="k">Posición</div><div class="v">${p}ª</div><div class="s">${me.pts} pts · ${me.pj} jugados</div></div>
      <div class="w"><div class="k">Racha</div><div class="form" style="margin:0">${form||'<span style="background:var(--fill);color:var(--ink2)">–</span>'}</div><div class="s">${won} de ${played.length} ganados</div></div>
      <div class="w"><div class="k">Goles</div><div class="v">${me.gf}<span style="font-size:20px;color:var(--ink2)"> / ${me.gc}</span></div><div class="s">a favor / en contra</div></div>
      <div class="w"><div class="k">Goleadoras</div>${tops.length?tops.map(t=>`<div class="row"><span>${esc(nomC(t.n))}</span><b>${t.g}</b></div>`).join(""):'<div class="s">Aún sin goles</div>'}</div>
      <div class="w wide"><div class="k">Clasificación</div>${TABLA.slice(0,3).map((r,i)=>`<div class="row${r.t===US?" us":""}"><span>${i+1} · ${esc(sn(r.t))}</span><span>${r.pts}</span></div>`).join("")}${p>3?`<div class="row us"><span>${p} · Barajas</span><span>${me.pts}</span></div>`:""}</div>
    </div>`;
  }

  /* ---------- TEMPORADA: línea de tiempo ---------- */
  let filtro="todo";
  function drawCal(){
    const list=ours.map((o,i)=>({o,i})).filter(({o})=>filtro==="todo"||(!o.rest&&(filtro==="casa"?o.home:!o.home)));
    document.getElementById("p-cal").innerHTML=`<h2>Nuestro camino</h2>
      <div class="seg2" role="group" aria-label="Filtrar partidos">${[["todo","Todo"],["casa","En casa"],["fuera","Fuera"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${filtro===k}">${t}</button>`).join("")}</div>
      <div class="tl">`+list.map(({o,i})=>{
        if(o.rest)return `<div class="tli"><span class="dot"></span><div class="tc future"><div class="m1"><span>J${o.j} · ${fmt(o.f)}</span></div><div class="m2"><span class="nm">Descanso</span></div></div></div>`;
        const k=kind(o),isN=i===nextIdx&&!o.g;
        const cnt={};(o.goles||[]).filter(g=>g.nuestro&&!g.propia).forEach(g=>cnt[g.nombre]=(cnt[g.nombre]||0)+1);
        const chips=Object.keys(cnt).length?`<div class="chips">${Object.entries(cnt).map(([n,c])=>`<span class="chip">${esc(nomC(n))}${c>1?" ×"+c:""}</span>`).join("")}</div>`:"";
        const L=o.home?US:o.opp,V=o.home?o.opp:US;
        return `<button class="tli" data-i="${i}"><span class="dot ${k||(isN?"next":"")}"></span><div class="tc${isN?" next":""}${!o.g&&!isN?" future":""}${i===sel?" sel":""}">
          <div class="m1"><span>J${o.j} · ${fmt(o.f)} · ${o.home?"En casa":"Fuera"}</span><span>${k?kindTxt[k]:isN?"Próximo":o.hora||""}</span></div>
          <div class="m2"><span class="nm">${shirt(o.opp,24)}${esc(sn(L))} – ${esc(sn(V))}</span><span class="sc">${o.raw?o.raw[0]+"-"+o.raw[1]:o.hora&&isN?o.hora:""}</span></div>${chips}</div></button>`;
      }).join("")+`</div><p class="note">Toca un partido para verlo en Inicio con todos sus detalles.</p>`;
    document.querySelectorAll("#p-cal .tli[data-i]").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;drawHero();drawCal();go("home");window.scrollTo({top:0,behavior:"smooth"})});
    document.querySelectorAll("#p-cal .seg2 button").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;drawCal()});
  }

  /* ---------- TABLA: barras, duelo, tabla completa, cuadro y horarios ---------- */
  function drawTab(){
    const max=Math.max(1,...TABLA.map(r=>r.pts));
    const bars=`<div class="bars">`+TABLA.map((r,i)=>`<div class="bar${r.t===US?" us":""}"><span class="p">${i+1}</span><span class="nm">${shirt(r.t,18)}${esc(sn(r.t))}</span><div class="track"><div class="fill" style="width:${Math.max(8,r.pts/max*100)}%">${r.pts}</div></div></div>`).join("")+`</div>`;
    /* Duelo contra el próximo rival */
    const nx=ours[nextIdx];let duel="";
    if(nx&&!nx.rest&&!nx.g){
      const a=S[US],b=S[nx.opp];
      const line=(lab,x,y,lowBetter)=>{const m=Math.max(1,x,y);return `<div class="dl"><div class="t l"><i style="width:${x/m*100}%"></i></div><div class="c"><b>${x}</b> ${lab} <b>${y}</b></div><div class="t r"><i style="width:${y/m*100}%"></i></div></div>`};
      duel=`<h2>El duelo · J${nx.j}</h2><div class="duel"><div class="hd2"><span>Barajas · ${posOf(US)}ª</span><span>${esc(sn(nx.opp))} · ${posOf(nx.opp)}ª</span></div>
        ${line("puntos",a.pts,b.pts)}${line("goles",a.gf,b.gf)}${line("encajados",a.gc,b.gc)}${line("jugados",a.pj,b.pj)}</div>`;
    }
    /* Cuadro de resultados: filas = local, columnas = visitante */
    const teams=TABLA.map(r=>r.t);
    const res={};J.forEach(([,,ms])=>ms.forEach(([h,a,g])=>{res[h+"|"+a]=g}));
    const mx=`<h2>Cuadro de resultados</h2><div class="mx"><table><thead><tr><th class="rh">Local ↓ / Visit. →</th>${teams.map(t=>`<th class="${t===US?"us":""}" title="${esc(sn(t))}">${ABR[t]||"?"}</th>`).join("")}</tr></thead><tbody>`+
      teams.map(h=>`<tr><th class="rh${h===US?" us":""}">${ABR[h]||"?"}</th>`+teams.map(a=>{
        if(h===a)return `<td class="diag"></td>`;
        const g=res[h+"|"+a];const us=h===US||a===US;
        if(!g)return `<td class="${us?"us":""}">${g===null?"":""}</td>`;
        const k=g[0]>g[1]?"W":g[0]<g[1]?"L":"D";
        return `<td class="${k}${us?" us":""}">${g[0]}-${g[1]}</td>`}).join("")+`</tr>`).join("")+
      `</tbody></table></div><div class="legend"><span style="--c:color-mix(in srgb,var(--green) 45%,transparent)">Gana el local</span><span style="--c:color-mix(in srgb,var(--orange) 45%,transparent)">Empate</span><span style="--c:color-mix(in srgb,var(--red) 45%,transparent)">Gana el visitante</span><span style="--c:var(--yellow)">Partidos del Barajas</span></div>
      <p class="note">${teams.map(t=>`${ABR[t]} = ${esc(sn(t))}`).join(" · ")}</p>`;
    /* Cuándo juega cada equipo en casa */
    const pats=teams.map(t=>({t,pt:patron(t)})).filter(x=>x.pt);
    const hor=pats.length?`<h2>¿Cuándo juega cada equipo en casa?</h2><div class="hr">`+pats.map(({t,pt})=>`<div class="cell">${shirt(t,26)}<div class="txt"><div class="ttl">${esc(sn(t))}</div><div class="meta">Normalmente el ${pt.dia}${pt.hora?" a las "+pt.hora:""}${pt.horas.length>1?" · también "+pt.horas.slice(1).map(x=>x[0]).join(", "):""}</div></div><div class="end when">${pt.n} partido${pt.n>1?"s":""}</div></div>`).join("")+`</div><p class="note">Sale de las actas de esta temporada y la anterior. Los lunes a partir de las 9:00 la RFFM publica los horarios de la jornada, y la app se actualiza a las 9:03.</p>`:"";
    document.getElementById("p-tab").innerHTML=`<h2>Clasificación</h2>`+bars+duel+
      `<h2>Tabla completa</h2><div class="tbl"><table><thead><tr><th class="t" colspan="2">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th></tr></thead><tbody>`+
      TABLA.map((r,i)=>`<tr${r.t===US?' class="us"':""}><td class="pos">${i+1}</td><td class="t"><span class="who">${shirt(r.t,22)}${esc(sn(r.t))}</span></td><td class="p">${r.pts}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td></tr>`).join("")+
      `</tbody></table></div><p class="note">Calculada con los resultados (3 puntos victoria, 1 empate). Si hay sanciones o aplazados, la oficial de la RFFM es la que vale.</p>`+mx+hor;
  }

  /* ---------- PLANTILLA ---------- */
  let orden="goles";
  function drawPla(){
    const P=[...players].sort(orden==="goles"?(a,b)=>b.g-a.g||b.pj-a.pj||a.n.localeCompare(b.n):orden==="pj"?(a,b)=>b.pj-a.pj||b.g-a.g||a.n.localeCompare(b.n):(a,b)=>nomL(a.n).localeCompare(nomL(b.n)));
    const G=(DATA.goleadoras||[]).filter(r=>r&&r.n);
    const norm=t=>t.replace("VILLAVICIOSA DE ODON B","VILLAVICIOSA DE ODON 'B'");
    let pos=0,prev=null;
    document.getElementById("p-pla").innerHTML=`<h2>La plantilla</h2><div class="squad">
      <div class="seg2" role="group" aria-label="Ordenar">${[["goles","Goles"],["pj","Partidos"],["az","A–Z"]].map(([k,t])=>`<button data-o="${k}" aria-pressed="${orden===k}">${t}</button>`).join("")}</div>
      <div class="sq h"><span></span><span>Jugadora</span><span style="text-align:center">PJ</span><span style="text-align:center">Goles</span></div>`+
      (P.length?P.map(p=>`<div class="sq"><span class="av${p.g?" g":""}">${esc(ini(p.n))}</span><span class="nm">${esc(nomL(p.n))}</span><span class="pj">${p.pj}</span><span class="n${p.g?"":" z"}">${p.g}</span></div>`).join(""):`<div class="sq"><span></span><span class="nm">Aún no hay actas con convocatoria</span></div>`)+
      `</div><p class="note">PJ = partidos en los que ha sido convocada, según las actas de la RFFM.</p>`+
      (G.length?`<h2>Goleadoras de la liga</h2><div class="tbl"><table><thead><tr><th class="t" colspan="2">Jugadora</th><th>Goles</th></tr></thead><tbody>`+
      G.map((r,i)=>{if(r.g!==prev){pos=i+1;prev=r.g}const eq=norm(r.eq);return `<tr${eq===US?' class="us"':""}><td class="pos">${pos}</td><td class="t"><span class="who">${shirt(eq,22)}<span>${esc(nomL(r.n))}<br><small style="color:var(--ink2)">${esc(sn(eq))}</small></span></span></td><td class="p">${r.g}</td></tr>`}).join("")+
      `</tbody></table></div>`:"");
    document.querySelectorAll("#p-pla .seg2 button").forEach(b=>b.onclick=()=>{orden=b.dataset.o;drawPla()});
  }

  /* ---------- JORNADAS ---------- */
  let cur=Math.max(0,J.findIndex(([,f])=>dOf(f)>=today));
  function drawJor(){
    const [j,f,ms,rest]=J[cur];
    const n=t=>t===US?`<b>${esc(sn(t))}</b>`:esc(sn(t));
    document.getElementById("p-jor").innerHTML=`<h2>Jornadas</h2><div class="seg"><button class="round" id="jp" aria-label="Jornada anterior" ${cur===0?"disabled":""}>${ico.left}</button><div class="lbl2">Jornada ${j}<span>${fmt(f,{weekday:"long",day:"numeric",month:"long"})}</span></div><button class="round" id="jn" aria-label="Jornada siguiente" ${cur===J.length-1?"disabled":""}>${ico.right}</button></div>
      <div class="group">`+ms.map(([h,a,g])=>{const us=h===US||a===US;const c=CAMPOS[h];
        const where=us&&DET[j]&&DET[j].campo?cleanCampo(DET[j].campo):c?c[0]:"";
        return `<div class="gm${us?" us":""}"><div class="h">${n(h)}${shirt(h,24)}</div><div class="s">${g?g[0]+" - "+g[1]:"–"}</div><div class="a">${shirt(a,24)}${n(a)}</div>${where?`<div class="where"><a href="${placeOf(us?ours.find(o=>o.j===j):{home:false,opp:h}).url}" target="_blank" rel="noopener">${esc(where)}</a></div>`:""}</div>`}).join("")+
      `</div>`+rest.map(t=>`<p class="note">Descansa: ${esc(sn(t))}</p>`).join("");
    document.getElementById("jp").onclick=()=>{if(cur>0){cur--;drawJor();syncHero(J[cur][0])}};
    document.getElementById("jn").onclick=()=>{if(cur<J.length-1){cur++;drawJor();syncHero(J[cur][0])}};
  }
  function syncHero(j){const i=ours.findIndex(o=>o.j===j);if(i>=0){sel=i;drawHero();drawCal()}}

  drawHero();drawWidgets();drawCal();drawTab();drawPla();drawJor();
  if(DATA.actualizado){const d=new Date(DATA.actualizado);document.getElementById("upd").textContent="Datos de la RFFM · actualizado el "+d.toLocaleString("es-ES",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}

  const TABS=["home","cal","tab","pla","jor"];
  function go(p){
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.p===p));
    TABS.forEach(t=>document.getElementById("p-"+t).hidden=t!==p);
    try{localStorage.setItem("tab2",p)}catch(e){}
  }
  document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{go(btn.dataset.p);window.scrollTo({top:0})});
  try{const t=localStorage.getItem("tab2");if(t&&TABS.includes(t))go(t)}catch(e){}
}
</script>
</body>
</html>
